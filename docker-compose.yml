services:
  chronoguard:
    build: .
    container_name: chronoguard
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-3000}
      # Point at a remote chrony daemon (e.g. the server's Tailscale IP)
      # when you are NOT running alongside it:
      - CHRONY_HOST=${CHRONY_HOST:-}
      - CHRONY_PORT=${CHRONY_PORT:-323}
    volumes:
      # Allows chronyc (in-container) to query the host Chrony daemon.
      - /var/run/chrony:/var/run/chrony:ro
